server.port=${PORT:8080}

spring.application.name=Blackwater

blackwater.ai.provider=${AI_PROVIDER:openai}

blackwater.ai.openai.api-key=${OPENAI_API_KEY:}
blackwater.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
blackwater.ai.openai.deep-model=${OPENAI_DEEP_MODEL:gpt-4o-mini}
blackwater.ai.openai.powerful-model=${OPENAI_PRIME_MODEL:gpt-4o-mini}

blackwater.ai.gemini.api-key=${GEMINI_API_KEY:}
blackwater.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
blackwater.ai.gemini.deep-model=${GEMINI_DEEP_MODEL:gemini-2.5-pro}
blackwater.ai.gemini.powerful-model=${GEMINI_PRIME_MODEL:gemini-2.5-pro}

blackwater.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
blackwater.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
blackwater.ai.anthropic.deep-model=${ANTHROPIC_DEEP_MODEL:claude-sonnet-5}
blackwater.ai.anthropic.powerful-model=${ANTHROPIC_PRIME_MODEL:claude-sonnet-5}

blackwater.ai.custom.base-url=${CUSTOM_AI_BASE_URL:}
blackwater.ai.custom.api-key=${CUSTOM_AI_API_KEY:}
blackwater.ai.custom.model=${CUSTOM_AI_MODEL:default}
blackwater.ai.custom.deep-model=${CUSTOM_AI_DEEP_MODEL:default}
blackwater.ai.custom.powerful-model=${CUSTOM_AI_PRIME_MODEL:default}
