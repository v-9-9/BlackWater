server.port=${PORT:8080}

spring.application.name=Blackwater

blackwater.ai.provider=${AI_PROVIDER:openai}

blackwater.ai.openai.api-key=${OPENAI_API_KEY:}
blackwater.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

blackwater.ai.gemini.api-key=${GEMINI_API_KEY:}
blackwater.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

blackwater.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
blackwater.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
